# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.allowed_domains: '%env(csv:APP_ALLOWED_DOMAINS)%'
    app.admin_emails: '%env(csv:APP_ADMIN_EMAILS)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Security\Service\AllowedEmailChecker:
        arguments:
            $allowedDomains: '%app.allowed_domains%'
            $adminEmails: '%app.admin_emails%'

    App\Security\Service\AdminRoleResolver:
        arguments:
            $adminEmails: '%app.admin_emails%'

    App\Security\Service\OtpCodeManager:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Sync\Service\OvhApiClient:
        arguments:
            $appKey: '%env(string:OVH_APP_KEY)%'
            $appSecret: '%env(string:OVH_APP_SECRET)%'
            $consumerKey: '%env(string:OVH_CONSUMER_KEY)%'
            $endpoint: '%env(string:OVH_ENDPOINT)%'

    App\Sync\Service\AdminMailboxSynchronizer:
        arguments:
            $allowedDomains: '%app.allowed_domains%'
            $migrationSourceDomain: '%env(string:APP_MIGRATION_SOURCE_DOMAIN)%'
            $migrationTargetDomain: '%env(string:APP_MIGRATION_TARGET_DOMAIN)%'

    App\Sync\Service\UserMailboxSynchronizer:
        arguments:
            $migrationSourceDomain: '%env(string:APP_MIGRATION_SOURCE_DOMAIN)%'
            $migrationTargetDomain: '%env(string:APP_MIGRATION_TARGET_DOMAIN)%'

    App\Sync\Service\MailboxPasswordCipher:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Sync\Service\MailClientSettings:
        arguments:
            $imapHost: '%env(string:MAIL_IMAP_HOST)%'
            $imapPort: '%env(int:MAIL_IMAP_PORT)%'
            $smtpHost: '%env(string:MAIL_SMTP_HOST)%'
            $smtpPort: '%env(int:MAIL_SMTP_PORT)%'

    App\User\Service\ManagedMailboxResolver:
        arguments:
            $targetDomain: '%env(string:APP_MIGRATION_TARGET_DOMAIN)%'

    App\Security\Service\LoginUserResolver:
        arguments:
            $migrationSourceDomain: '%env(string:APP_MIGRATION_SOURCE_DOMAIN)%'
            $migrationTargetDomain: '%env(string:APP_MIGRATION_TARGET_DOMAIN)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
